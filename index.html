<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>같이가개 — 반려동반 장소 지도</title>
<style>
  /* Cafe24 써라운드 — 상업적 사용 무료.
     원본 1.54MB 중 UI 고정 문구에 쓰이는 463자만 남겨 49.5KB 로 줄였다.
     장소명·주소는 임의의 글자라 서브셋으로 감당할 수 없고, 숫자가 많아
     가독성이 더 중요하므로 기본 폰트를 그대로 쓴다. */
  @font-face {
    font-family: 'Cafe24Ssurround';
    src: url('fonts/Cafe24Ssurround-ui.woff2') format('woff2');
    font-weight: 400 800;
    font-style: normal;
    font-display: swap; /* 폰트를 기다리며 글자가 사라지지 않도록 */
  }

  :root{
    /* 따뜻한 주황·노랑 팔레트. 진한 색은 글자·선택 상태에만 쓰고
       넓은 면적은 크림/연주황으로 깔아서 가볍고 말랑한 인상을 만든다. */
    --bg: #FFF9F0;
    --surface: #FFFFFF;
    --line: #F3E7D7;
    --ink: #3D2E1F;        /* 검정 대신 진한 브라운 — 따뜻하게 */
    --ink-muted: #A08B75;

    --brand: #F59E42;      /* 메인 주황 (채움용) */
    --brand-deep: #DE7A2C; /* 진한 주황 (글자·강조용, 대비 확보) */
    --brand-soft: #FFEBD6;
    --sun: #FFC94A;        /* 노랑 포인트 */
    --sun-soft: #FFF4D8;
    --mint: #6FBF9B;       /* 보조색 — 일부구역 구분용 */
    --mint-soft: #E4F4EC;
    --heart: #FF6B81;

    --radius-sm: 14px;
    --radius-md: 18px;
    --radius-lg: 24px;
    --shadow-soft: 0 6px 18px rgba(180, 120, 60, 0.10);
    --shadow-pop: 0 10px 28px rgba(180, 120, 60, 0.16);

    /* 이전 이름을 쓰는 곳이 남아 있어도 깨지지 않도록 별칭으로 유지 */
    --pine: #DE7A2C;
    --pine-light: #6FBF9B;
    --amber: #F59E42;
    --amber-soft: #FFEBD6;
  }
  /* 써라운드를 쓰는 곳 — 브랜드·제목·버튼·칩·태그 등 문구가 고정된 UI */
  h1, h2,
  .fchip, #region-btn, .chip,
  .list-toggle, .btn, #region-apply,
  #sheet-header span, #sheet-header button,
  #region-header > span, #region-header button, .region-label,
  .field label, .field-hint, .tag, .empty-state, .header-count,
  #modal .sub, #modal .notice, .map-hint,
  #search-input, #search-input::placeholder {
    font-family: 'Cafe24Ssurround', -apple-system, BlinkMacSystemFont,
                 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* Header — 최소화 */
  header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand-mark { font-size: 18px; line-height: 1; }
  h1 {
    font-size: 16.5px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--pine);
  }
  .header-count {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 600;
  }

  /* 검색 — 이름·주소·비고를 한 번에 훑는다 */
  #search-row {
    padding: 10px 14px 2px;
    background: var(--surface);
    flex-shrink: 0;
  }
  #search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 0 14px;
    height: 40px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  #search-box:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--brand-soft);
  }
  .search-ico { font-size: 13px; opacity: 0.75; line-height: 1; }
  #search-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    outline: none;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    -webkit-appearance: none;
  }
  #search-input::placeholder { color: var(--ink-muted); }
  #search-input::-webkit-search-cancel-button { display: none; }
  #search-clear {
    border: none;
    background: var(--line);
    color: var(--ink-muted);
    width: 19px;
    height: 19px;
    border-radius: 50%;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  #search-clear[hidden] { display: none; }

  /* Filter chips — 카테고리 필터 */
  #filter-row {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #filter-row::-webkit-scrollbar { display: none; }
  .fchip {
    flex-shrink: 0;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease,
                border-color 0.18s ease, transform 0.12s ease;
  }
  .fchip:active { transform: scale(0.95); }
  .fchip.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    box-shadow: 0 3px 10px rgba(245, 158, 66, 0.35);
  }

  /* 지역 필터 버튼 — 칩 줄을 지도 위에서 걷어내고 버튼 하나로 접었다 */
  #region-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-muted);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.18s ease, color 0.18s ease,
                border-color 0.18s ease, transform 0.12s ease;
  }
  #region-btn:active { transform: scale(0.95); }
  #region-btn.active {
    background: var(--brand-deep);
    border-color: var(--brand-deep);
    color: #fff;
    box-shadow: 0 3px 10px rgba(222, 122, 44, 0.35);
  }
  #region-btn .caret { font-size: 9px; opacity: 0.7; }
  /* 조건 칩과 지역 버튼 사이 구분선 */
  #filter-row .divider {
    flex-shrink: 0;
    width: 1px;
    background: var(--line);
    margin: 2px 2px;
  }

  /* 지역 선택 바텀시트 — 시/도 → 구/군 드릴다운 (칩이 가로 스크롤 대신 줄바꿈됨) */
  #region-overlay {
    position: absolute;
    inset: 0;
    background: rgba(20,24,20,0.42);
    z-index: 950;
    display: none;
    align-items: flex-end;
  }
  #region-overlay.show { display: flex; }
  #region-sheet {
    background: var(--surface);
    width: 100%;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    max-height: 75%;
    display: flex;
    flex-direction: column;
  }
  #region-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 8px;
    flex-shrink: 0;
  }
  #region-header > span { font-size: 14.5px; font-weight: 800; color: var(--pine); }
  #region-header .sheet-actions { display: flex; align-items: center; gap: 12px; }
  #region-header button {
    border: none;
    background: none;
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  #region-header #region-close { font-size: 13px; }
  #region-body { overflow-y: auto; padding: 4px 18px 8px; }
  .region-group { margin-bottom: 16px; }
  .region-group[hidden] { display: none; }
  .region-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-muted);
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }
  .region-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #region-footer {
    flex-shrink: 0;
    padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  #region-apply {
    width: 100%;
    border: none;
    background: var(--pine);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  /* Map — 겹치는 요소 최소화 */
  #map-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #map { width: 100%; height: 100%; background: #EDEBE3; }


  .locate-btn {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 17px;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }

  /* 제보하기 버튼 — 모두에게 노출 */
  .fab {
    position: absolute;
    right: 12px;
    bottom: 62px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--sun), var(--brand));
    color: #fff;
    border: none;
    font-size: 25px;
    box-shadow: 0 6px 18px rgba(245, 158, 66, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.18s ease;
  }
  .fab:active {
    transform: scale(0.9);
    box-shadow: 0 3px 10px rgba(245, 158, 66, 0.45);
  }

  /* 목록 보기 토글 버튼 */
  .list-toggle {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 800;
    box-shadow: var(--shadow-pop);
    z-index: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    transition: transform 0.14s ease;
  }
  .list-toggle:active { transform: translateX(-50%) scale(0.96); }
  .list-toggle .cnt { color: var(--brand-deep); }

  /* 목록 시트 (오버레이) */
  #sheet-overlay {
    position: absolute;
    inset: 0;
    background: rgba(20,24,20,0.42);
    z-index: 900;
    display: none;
    align-items: flex-end;
  }
  #sheet-overlay.show { display: flex; }
  #sheet {
    background: var(--surface);
    width: 100%;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    max-height: 70%;
    display: flex;
    flex-direction: column;
  }
  #sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 8px;
    flex-shrink: 0;
  }
  #sheet-header span { font-size: 14.5px; font-weight: 800; color: var(--pine); }
  #sheet-header .sheet-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #sheet-header button {
    border: none;
    background: none;
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #sheet-header #sheet-close { font-size: 13px; }
  #list-body { overflow-y: auto; padding-bottom: env(safe-area-inset-bottom); }

  .place-card {
    margin: 0 14px 10px;
    padding: 13px 14px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    display: flex;
    gap: 10px;
    align-items: flex-start;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .place-card:active {
    transform: scale(0.985);
    border-color: var(--brand);
    box-shadow: var(--shadow-soft);
  }
  .place-card .paw { font-size: 16px; margin-top: 1px; }
  .place-card .body { flex: 1; min-width: 0; }
  .place-card .name {
    font-size: 14.5px;
    font-weight: 800;
    margin: 0 0 4px;
    color: var(--ink);
  }
  /* 같은 이름의 다른 지점을 구분하려면 주소가 반드시 보여야 한다 */
  .place-card .addr {
    font-size: 12px;
    color: var(--ink-muted);
    margin: 0 0 6px;
    display: flex;
    gap: 4px;
    align-items: flex-start;
    line-height: 1.45;
    word-break: keep-all;
  }
  .place-card .addr .pin-ico { flex-shrink: 0; opacity: 0.8; }
  .place-card .meta {
    font-size: 12px;
    color: var(--ink-muted);
    margin: 0;
    line-height: 1.5;
  }
  .place-card .note { margin-top: 4px; display: block; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    margin-right: 5px;
    margin-bottom: 3px;
  }
  .tag.free  { background: var(--brand-soft); color: var(--brand-deep); }
  .tag.limit { background: var(--mint-soft); color: #3E8B69; }
  .tag.status-ok   { background: var(--sun-soft); color: #A9791A; }
  .tag.status-warn { background: #FBE3DC; color: #B0452B; }
  .tag.perk { background: var(--mint-soft); color: #3E8B69; }
  .fav-btn {
    font-size: 19px;
    border: none;
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
    padding: 2px;
    color: #E3D6C4;
    transition: color 0.18s ease, transform 0.14s ease;
  }
  .fav-btn:active { transform: scale(0.85); }
  .fav-btn.active { color: var(--heart); }
  /* 하트를 켤 때 뿅 하고 튀어오르게 */
  .fav-btn.pop { animation: heart-pop 0.42s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes heart-pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.45) rotate(-8deg); }
    65%  { transform: scale(0.92) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .empty-state {
    padding: 26px 20px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  /* 제보 모달 */
  /* 제보 모달 — 주소만 입력받으므로 평범한 바텀시트로 둔다.
     (지도에 핀을 찍는 방식은 좁은 화면에서 정확히 찍기 어려워 걷어냈다.
      주소는 서버가 지오코딩해서 좌표를 채운다.) */
  #modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(70, 45, 20, 0.38);
    z-index: 1000;
    display: none;
    align-items: flex-end;
  }
  #modal-overlay.show { display: flex; }
  #modal {
    background: var(--surface);
    width: 100%;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 88%;
    overflow-y: auto;
    box-shadow: 0 -8px 24px rgba(120, 80, 30, 0.18);
  }
  .field-hint {
    font-size: 11.5px;
    color: var(--ink-muted);
    margin: 6px 0 0;
    line-height: 1.45;
  }
  #modal h2 { font-size: 16px; margin: 0 0 2px; color: var(--pine); }
  #modal .sub { font-size: 12px; color: var(--ink-muted); margin: 0 0 16px; }
  #modal .notice {
    font-size: 12.5px;
    color: var(--pine);
    background: var(--brand-soft);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .field input[type=text], .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .chip.active { background: var(--pine); border-color: var(--pine); color: #fff; }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary { background: var(--pine); color: #fff; }
  .btn.primary:disabled { background: #B9C4BC; }
  .btn.ghost { background: var(--bg); color: var(--ink-muted); border: 1px solid var(--line); }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    z-index: 1200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* 발바닥 마커 */
  .paw-pin {
    width: 30px;
    height: 32px;
    cursor: pointer;
    transform-origin: 50% 90%;
    transition: transform 0.18s cubic-bezier(0.3, 1.5, 0.5, 1);
  }
  .paw-pin svg { display: block; width: 100%; height: 100%; }
  .paw-pin:hover { transform: scale(1.12); }
  /* 선택된 마커는 통통 튀어서 어디를 눌렀는지 바로 보이게 */
  .paw-pin.selected { animation: paw-bounce 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes paw-bounce {
    0%   { transform: scale(1) translateY(0); }
    30%  { transform: scale(1.25) translateY(-7px); }
    60%  { transform: scale(0.96) translateY(0); }
    100% { transform: scale(1.1) translateY(0); }
  }

  /* 마커 말풍선 — 지도 위에 그냥 떠 있지 않도록 흰 카드로 감싼다 */
  .pop-card {
    width: 196px;
    box-sizing: border-box;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop);
    padding: 11px 13px;
    white-space: normal;
    word-break: keep-all;
    font-family: inherit;
  }
  .pop-card .pop-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 5px;
    line-height: 1.35;
  }
  .pop-card .pop-addr {
    font-size: 11.5px;
    color: var(--ink-muted);
    margin: 0 0 7px;
    line-height: 1.45;
  }
  .pop-card .pop-note {
    font-size: 11.5px;
    color: var(--ink);
    margin: 7px 0 0;
    line-height: 1.5;
    padding-top: 7px;
    border-top: 1px dashed var(--line);
  }
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <h1>같이가개</h1>
    </div>
    <span class="header-count" id="header-count">0곳</span>
  </header>

  <div id="search-row">
    <div id="search-box">
      <span class="search-ico">🔍</span>
      <input type="search" id="search-input" placeholder="장소 이름이나 동네로 찾기" autocomplete="off" />
      <button id="search-clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
    </div>
  </div>

  <div id="filter-row">
    <button id="region-btn"><span id="region-btn-label">지역</span><span class="caret">▼</span></button>
    <div class="divider"></div>
    <div class="fchip active" data-val="all">전체</div>
    <div class="fchip" data-val="free">전 구역 동반 가능</div>
    <div class="fchip" data-val="limit">일부 구역만</div>
    <div class="fchip" data-val="favorite">♥ 즐겨찾기</div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <button class="fab" id="fab-add" title="장소 제보하기">＋</button>
    <button class="locate-btn" id="locate-btn" title="내 위치로 이동">📍</button>
    <button class="list-toggle" id="list-toggle-btn">📋 목록보기 · <span class="cnt" id="list-toggle-count">0곳</span></button>
  </div>

  <div id="sheet-overlay">
    <div id="sheet">
      <div id="sheet-header">
        <span>등록된 장소</span>
        <div class="sheet-actions">
          <button id="sort-toggle">최근확인일 오래된순</button>
          <button id="sheet-close">닫기</button>
        </div>
      </div>
      <div id="list-body"></div>
    </div>
  </div>

  <div id="region-overlay">
    <div id="region-sheet">
      <div id="region-header">
        <span>지역 선택</span>
        <div class="sheet-actions">
          <button id="region-reset">초기화</button>
          <button id="region-close">닫기</button>
        </div>
      </div>
      <div id="region-body">
        <div class="region-group">
          <div class="region-label">시 / 도</div>
          <div class="region-chips" id="sido-chips">
            <div class="fchip active" data-sido="all">전체 지역</div>
          </div>
        </div>
        <div class="region-group" id="gu-group" hidden>
          <div class="region-label">구 / 군</div>
          <div class="region-chips" id="gu-chips"></div>
        </div>
      </div>
      <div id="region-footer">
        <button id="region-apply">전체 보기</button>
      </div>
    </div>
  </div>

  <div id="modal-overlay">
    <div id="modal">
      <h2>장소 제보하기</h2>
      <p class="sub">제보 주신 정보는 검토 후 지도에 반영됩니다.</p>
      <p class="notice">🐾 <strong>이동장·가방 없이 동반 가능</strong>하고 <strong>견종·체중 제한이 없는 곳</strong>만 등록하고 있어요. 조건에 맞지 않으면 반영이 어려울 수 있어요.</p>

      <div id="modal-form">
      <div class="field">
        <label>상호명 / 장소명</label>
        <input type="text" id="f-name" placeholder="예: 을지로 개풀카페" />
      </div>

      <div class="field">
        <label>주소</label>
        <input type="text" id="f-address" placeholder="예: 서울 중구 을지로 123" />
        <p class="field-hint">도로명주소로 적어주시면 지도에 더 정확히 표시돼요.</p>
      </div>

      <div class="field">
        <label>동반 조건</label>
        <div class="chip-row" id="condition-chips">
          <div class="chip active" data-val="free">전 구역 동반 가능</div>
          <div class="chip" data-val="limit">일부 구역만 (반려동물 전용구역 등)</div>
        </div>
      </div>

      <div class="field">
        <label>비고 (선택)</label>
        <textarea id="f-note" placeholder="예: 실내 전 구역 동반 가능, 소형~대형견 모두 환영"></textarea>
      </div>

      <div class="field">
        <label>연락처 (선택)</label>
        <input type="text" id="f-contact" placeholder="선택 입력" />
      </div>
      </div><!-- /#modal-form -->

      <div class="modal-actions">
        <button class="btn ghost" id="btn-cancel">취소</button>
        <button class="btn primary" id="btn-submit" disabled>제보하기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=4pq1lhz3ti"></script>
<script>
(function () {
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbweuaW_Hdpk8u5MzaQxfOR4wRmDA8LSB-Isne5M4md0Piyke30_H7dAfGeiyRyBIi4m0Q/exec';
  const FAVORITES_KEY = 'gachigagae_favorites';
  const DEFAULT_CENTER = { lat: 37.5665, lng: 126.9780 };

  let places = [];
  let favorites = [];
  let map;
  let markers = [];
  let infoWindow;
  let currentFilter = 'all';
  let selectedSido = null; // null = 전체 지역
  const selectedGus = new Set(); // 비어있으면 선택된 시/도의 전체 구/군
  let searchQuery = '';

  const SIDO_SHORT = {
    '서울특별시': '서울', '부산광역시': '부산', '대구광역시': '대구', '인천광역시': '인천',
    '광주광역시': '광주', '대전광역시': '대전', '울산광역시': '울산', '세종특별자치시': '세종',
    '경기도': '경기', '강원특별자치도': '강원', '강원도': '강원', '충청북도': '충북', '충청남도': '충남',
    '전북특별자치도': '전북', '전라북도': '전북', '전라남도': '전남', '경상북도': '경북', '경상남도': '경남',
    '제주특별자치도': '제주',
  };
  let sortByOldestChecked = false;

  const el = (id) => document.getElementById(id);
  const toastEl = el('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function loadFavorites() {
    try {
      favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
    } catch (e) {
      favorites = [];
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
    } catch (e) {
      // 저장 안 되어도 세션 내에서는 정상 동작
    }
  }

  function isFavorite(id) {
    return favorites.includes(id);
  }

  function toggleFavorite(id) {
    const i = favorites.indexOf(id);
    if (i === -1) { favorites.push(id); } else { favorites.splice(i, 1); }
    saveFavorites();
    renderMarkers();
    renderList();
  }

  function conditionLabel(val) {
    if (val === 'limit') return { text: '일부 구역만', cls: 'limit' };
    return { text: '전 구역 동반 가능', cls: 'free' };
  }

  function statusLabel(val) {
    if (val === '폐업의심') return { text: '⚠ 폐업의심', cls: 'status-warn' };
    if (val === '정상') return { text: '정상', cls: 'status-ok' };
    return null;
  }

  // 주소에서 시/도, 구/군/시를 분리 추출 (예: "서울특별시 중구 을지로 123" → { sido: '서울', gu: '중구' })
  function regionParts(address) {
    if (!address) return { sido: '기타', gu: '' };
    const trimmed = address.trim();
    // "○○특별시/광역시/도 ○○구/군/시" 패턴을 우선으로 찾는다
    // 한글 뒤에는 \b(단어 경계)가 동작하지 않으므로 공백/문자열 끝 lookahead로 대체
    const match = trimmed.match(/(\S*?(특별시|광역시|특별자치시|특별자치도|도))\s+(\S*?(?:시|군|구))(?=\s|$)/);
    if (match) {
      const sidoFull = match[1];
      return { sido: SIDO_SHORT[sidoFull] || sidoFull, gu: match[3] };
    }
    const parts = trimmed.split(/\s+/);
    // 시/도가 빠지고 구/군/시만 있는 경우 그대로 사용 (데이터 보정 전 방어)
    // 단, "○○광역시"처럼 시/도 전체가 통으로 첫 토큰인 경우는 제외
    if (parts[0] && /(시|군|구)$/.test(parts[0]) && !/(특별시|광역시|특별자치시|특별자치도|도)$/.test(parts[0])) {
      return { sido: '기타', gu: parts[0] };
    }
    if (parts.length >= 2) return { sido: parts[0], gu: parts[1] };
    return { sido: parts[0] || '기타', gu: '' };
  }

  // 발바닥 마커. 동반조건에 따라 색을 나눠서 지도만 봐도 구분되게 한다.
  function pawSvg(fill) {
    return (
      `<svg viewBox="0 0 30 32" xmlns="http://www.w3.org/2000/svg">` +
      `<ellipse cx="15" cy="29.5" rx="5.5" ry="1.9" fill="rgba(90,60,20,0.20)"/>` +
      `<g fill="${fill}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round">` +
      `<ellipse cx="15" cy="19.6" rx="7.6" ry="6.6"/>` +
      `<ellipse cx="6.6" cy="12.4" rx="3.5" ry="4.3"/>` +
      `<ellipse cx="12.4" cy="7.4" rx="3.5" ry="4.5"/>` +
      `<ellipse cx="18.6" cy="7.4" rx="3.5" ry="4.5"/>` +
      `<ellipse cx="24.2" cy="12.4" rx="3.4" ry="4.2"/>` +
      `</g></svg>`
    );
  }

  function placePinIcon(condition) {
    const fill = condition === 'limit' ? '#6FBF9B' : '#F59E42';
    return {
      content: `<div class="paw-pin">${pawSvg(fill)}</div>`,
      size: new naver.maps.Size(30, 32),
      anchor: new naver.maps.Point(15, 29),
    };
  }


  function filteredPlaces() {
    const q = searchQuery.trim().toLowerCase().replace(/\s+/g, '');
    return places.filter((p) => {
      if (currentFilter === 'favorite' && !isFavorite(p.id)) return false;
      if (['free', 'limit'].includes(currentFilter) && p.condition !== currentFilter) return false;
      if (selectedSido) {
        const { sido, gu } = regionParts(p.address);
        if (sido !== selectedSido) return false;
        if (selectedGus.size > 0 && !selectedGus.has(gu)) return false;
      }
      if (q) {
        // 이름·주소·비고를 한 번에 훑는다 (공백 무시해서 "잔다리로 3길"도 잡히게)
        const hay = `${p.name || ''}${p.address || ''}${p.note || ''}`
          .toLowerCase().replace(/\s+/g, '');
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  // 대분류(시/도) 칩 목록을 그린다 — 지역 선택 바텀시트 안에 렌더링
  function updateRegionOptions() {
    const sidos = Array.from(new Set(places.map(p => regionParts(p.address).sido))).sort();
    const row = el('sido-chips');
    row.querySelectorAll('.fchip[data-sido]:not([data-sido="all"])').forEach(c => c.remove());
    sidos.forEach((s) => {
      const chip = document.createElement('div');
      chip.className = 'fchip';
      chip.dataset.sido = s;
      chip.textContent = s;
      row.appendChild(chip);
    });
    bindSidoChips();
    updateSidoChipState();
    renderGuRow();
    updateRegionBtn();
  }

  function updateSidoChipState() {
    el('sido-chips').querySelectorAll('.fchip').forEach((c) => {
      const isAll = c.dataset.sido === 'all';
      c.classList.toggle('active', isAll ? !selectedSido : c.dataset.sido === selectedSido);
    });
  }

  function bindSidoChips() {
    el('sido-chips').querySelectorAll('.fchip').forEach((chip) => {
      chip.onclick = () => {
        const s = chip.dataset.sido;
        selectedSido = (s === 'all') ? null : s;
        selectedGus.clear();
        updateSidoChipState();
        renderGuRow();
        applyRegionChange();
      };
    });
  }

  // 소분류(구/군) 칩 목록 — 선택된 시/도가 있을 때만 노출 (대분류 → 소분류 드릴다운)
  function renderGuRow() {
    const guGroup = el('gu-group');
    const guChips = el('gu-chips');
    guChips.innerHTML = '';
    if (!selectedSido) {
      guGroup.hidden = true;
      return;
    }
    guGroup.hidden = false;
    const gus = Array.from(new Set(
      places
        .filter(p => regionParts(p.address).sido === selectedSido)
        .map(p => regionParts(p.address).gu)
        .filter(Boolean)
    )).sort();

    const allChip = document.createElement('div');
    allChip.className = 'fchip active';
    allChip.dataset.gu = 'all';
    allChip.textContent = `${selectedSido} 전체`;
    guChips.appendChild(allChip);

    gus.forEach((g) => {
      const chip = document.createElement('div');
      chip.className = 'fchip';
      chip.dataset.gu = g;
      chip.textContent = g;
      if (selectedGus.has(g)) chip.classList.add('active');
      guChips.appendChild(chip);
    });
    bindGuChips();
    updateGuAllChipState();
  }

  function updateGuAllChipState() {
    const allChip = el('gu-chips').querySelector('.fchip[data-gu="all"]');
    if (allChip) allChip.classList.toggle('active', selectedGus.size === 0);
  }

  function bindGuChips() {
    el('gu-chips').querySelectorAll('.fchip').forEach((chip) => {
      chip.onclick = () => {
        const g = chip.dataset.gu;
        if (g === 'all') {
          selectedGus.clear();
        } else {
          if (selectedGus.has(g)) selectedGus.delete(g); else selectedGus.add(g);
        }
        el('gu-chips').querySelectorAll('.fchip[data-gu]:not([data-gu="all"])')
          .forEach(c => c.classList.toggle('active', selectedGus.has(c.dataset.gu)));
        updateGuAllChipState();
        applyRegionChange();
      };
    });
  }

  // 지역 선택이 바뀔 때마다 지도·목록·버튼 라벨을 함께 갱신한다
  function applyRegionChange() {
    renderMarkers();
    renderList();
    updateRegionBtn();
  }

  // 시트를 열지 않아도 지금 어떤 지역이 걸려 있는지 버튼만 보고 알 수 있게 한다
  function updateRegionBtn() {
    const btn = el('region-btn');
    const label = el('region-btn-label');
    const gus = Array.from(selectedGus);
    if (!selectedSido) {
      label.textContent = '지역';
      btn.classList.remove('active');
    } else if (gus.length === 0) {
      label.textContent = selectedSido;
      btn.classList.add('active');
    } else if (gus.length === 1) {
      label.textContent = gus[0];
      btn.classList.add('active');
    } else {
      label.textContent = `${gus[0]} 외 ${gus.length - 1}`;
      btn.classList.add('active');
    }
    const applyBtn = el('region-apply');
    if (applyBtn) applyBtn.textContent = `${filteredPlaces().length}곳 보기`;
  }

  // 지역 선택 결과가 지도에 들어오도록 시야를 맞춘다.
  // (필터만 걸리고 지도는 그대로면 헤더는 "2곳"인데 핀은 화면 밖에 있는 상황이 생긴다)
  function fitMapToFiltered() {
    if (!map) return;
    const pts = filteredPlaces().filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    if (pts.length === 0) return; // 결과가 없으면 지금 보던 화면을 유지
    if (pts.length === 1) {
      map.setCenter(new naver.maps.LatLng(pts[0].lat, pts[0].lng));
      map.setZoom(15);
      return;
    }
    const first = new naver.maps.LatLng(pts[0].lat, pts[0].lng);
    const bounds = new naver.maps.LatLngBounds(first, first);
    pts.slice(1).forEach(p => bounds.extend(new naver.maps.LatLng(p.lat, p.lng)));
    // 아래쪽은 목록보기 버튼·＋버튼이 떠 있어서 여백을 더 준다
    map.fitBounds(bounds, { top: 48, right: 48, bottom: 96, left: 48 });
    if (map.getZoom() > 16) map.setZoom(16); // 두 곳이 붙어 있을 때 과하게 확대되는 것 방지
  }

  // 시트를 열 때의 지역 상태 — 실제로 바뀐 경우에만 지도를 움직이기 위해 기억해 둔다
  let regionStateOnOpen = '';
  function regionStateKey() {
    return `${selectedSido || ''}|${Array.from(selectedGus).sort().join(',')}`;
  }

  function openRegionSheet() {
    regionStateOnOpen = regionStateKey();
    updateRegionBtn();
    el('region-overlay').classList.add('show');
  }

  // 시트가 덮고 있는 동안 옮기면 핀이 시트 뒤로 숨으므로, 닫는 시점에 시야를 맞춘다
  function closeRegionSheet() {
    el('region-overlay').classList.remove('show');
    if (regionStateKey() !== regionStateOnOpen) fitMapToFiltered();
  }

  function initMap() {
    map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng),
      zoom: 12,
      zoomControl: false,
      logoControlOptions: { position: naver.maps.Position.BOTTOM_LEFT },
    });
    // 기본 말풍선 껍데기를 모두 걷어내고 .pop-card 만 보이게 한다
    // (예전엔 배경이 투명해서 글자가 지도 라벨 위에 그대로 겹쳐 보였다)
    infoWindow = new naver.maps.InfoWindow({
      content: ' ',
      borderWidth: 0,
      backgroundColor: 'transparent',
      disableAnchor: true,
      pixelOffset: new naver.maps.Point(0, -6),
      maxWidth: 210,
    });

    // 빈 지도를 누르면 말풍선을 닫는다
    naver.maps.Event.addListener(map, 'click', () => {
      if (infoWindow.getMap()) { infoWindow.close(); clearSelectedMarker(); }
    });
  }

  // 선택 표시(통통 튀는 효과)는 한 번에 하나만
  function clearSelectedMarker() {
    document.querySelectorAll('.paw-pin.selected').forEach(n => n.classList.remove('selected'));
  }

  function openPlacePopup(p, marker) {
    clearSelectedMarker();
    infoWindow.setContent(popupContent(p));
    infoWindow.open(map, marker);
    const node = marker.getElement && marker.getElement();
    const pin = node && node.querySelector('.paw-pin');
    if (pin) pin.classList.add('selected');
  }


  function perkTags() {
    // 견종·체중 제한없음, 이동장·개모차 불필요는 등록 조건상 모든 장소의 기본값이라
    // 배지로 반복 표시하지 않습니다.
    return '';
  }

  function popupContent(p) {
    const cond = conditionLabel(p.condition);
    const status = statusLabel(p.status);
    return (
      `<div class="pop-card">` +
      `<p class="pop-name">${escapeHtml(p.name)}</p>` +
      (p.address ? `<p class="pop-addr">📍 ${escapeHtml(p.address)}</p>` : '') +
      `<span class="tag ${cond.cls}">${cond.text}</span>` +
      (status ? `<span class="tag ${status.cls}">${status.text}</span>` : '') +
      (p.note ? `<p class="pop-note">${escapeHtml(p.note)}</p>` : '') +
      `</div>`
    );
  }

  function renderMarkers() {
    markers.forEach(m => m.setMap(null));
    markers = [];
    filteredPlaces().forEach((p) => {
      const marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(p.lat, p.lng),
        map,
        icon: placePinIcon(p.condition),
      });
      marker.__place = p;
      naver.maps.Event.addListener(marker, 'click', () => openPlacePopup(p, marker));
      markers.push(marker);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderList() {
    const list = filteredPlaces();
    // 헤더 카운트도 필터 결과를 따라간다 (전체 등록 수가 아니라 지금 지도에 보이는 수)
    el('header-count').textContent = `${list.length}곳`;
    el('list-toggle-count').textContent = `${list.length}곳`;
    const body = el('list-body');
    if (list.length === 0) {
      // 검색 때문에 빈 건지, 원래 없는 건지 구분해서 알려준다
      body.innerHTML = searchQuery.trim()
        ? `<div class="empty-state">🐾<br/><strong>“${escapeHtml(searchQuery.trim())}”</strong> 검색 결과가 없어요.<br/>다른 이름이나 동네로 찾아보세요.</div>`
        : '<div class="empty-state">🐾<br/>해당 조건의 장소가 아직 없어요.</div>';
      return;
    }
    const sorted = sortByOldestChecked
      ? [...list].sort((a, b) => {
          const av = a.lastChecked ? new Date(a.lastChecked).getTime() : -Infinity;
          const bv = b.lastChecked ? new Date(b.lastChecked).getTime() : -Infinity;
          return av - bv;
        })
      : [...list];
    body.innerHTML = '';
    sorted.forEach((p) => {
      const cond = conditionLabel(p.condition);
      const status = statusLabel(p.status);
      const card = document.createElement('div');
      card.className = 'place-card';
      card.innerHTML = `
        <span class="paw">🐾</span>
        <div class="body">
          <p class="name">${escapeHtml(p.name)}</p>
          ${p.address ? `<p class="addr"><span class="pin-ico">📍</span><span>${escapeHtml(p.address)}</span></p>` : ''}
          <p class="meta">
            <span class="tag ${cond.cls}">${cond.text}</span>${status ? `<span class="tag ${status.cls}">${status.text}</span>` : ''}${perkTags(p)}
            ${p.note ? `<span class="note">${escapeHtml(p.note)}</span>` : ''}
          </p>
        </div>
        <button class="fav-btn ${isFavorite(p.id) ? 'active' : ''}" data-id="${p.id}">${isFavorite(p.id) ? '♥' : '♡'}</button>
      `;
      card.querySelector('.body').addEventListener('click', () => {
        map.morph(new naver.maps.LatLng(p.lat, p.lng), 16);
        const found = markers.find(m => m.__place && m.__place.id === p.id);
        if (found) openPlacePopup(p, found);
        el('sheet-overlay').classList.remove('show');
      });
      const favBtn = card.querySelector('.fav-btn');
      favBtn.addEventListener('click', (evt) => {
        evt.stopPropagation();
        const willBeOn = !isFavorite(p.id);
        toggleFavorite(p.id);
        // renderList()가 카드를 다시 그리므로, 새로 그려진 버튼에 애니메이션을 건다
        if (willBeOn) {
          const fresh = el('list-body').querySelector(`.fav-btn[data-id="${p.id}"]`);
          if (fresh) {
            fresh.classList.add('pop');
            fresh.addEventListener('animationend', () => fresh.classList.remove('pop'), { once: true });
          }
        }
      });
      body.appendChild(card);
    });
  }

  async function loadPlaces() {
    try {
      const res = await fetch(SHEET_API_URL);
      if (!res.ok) throw new Error('sheet fetch failed');
      places = await res.json();
    } catch (e) {
      showToast('구글 시트에서 데이터를 불러오지 못했어요.');
      places = [];
    }
    updateRegionOptions();
    renderMarkers();
    renderList();
  }

  // ---- Modal control (공개 제보 폼) ----
  function openModal() {
    el('f-name').value = '';
    el('f-address').value = '';
    el('f-note').value = '';
    el('f-contact').value = '';
    document.querySelectorAll('#condition-chips .chip').forEach(c => c.classList.remove('active'));
    document.querySelector('#condition-chips .chip[data-val="free"]').classList.add('active');
    el('btn-submit').disabled = true;
    el('btn-submit').textContent = '제보하기'; // 직전 제출이 중간에 끝났어도 라벨을 되돌린다
    el('modal-overlay').classList.add('show');
    el('modal').scrollTop = 0; // 시트가 스크롤된 채로 다시 열리지 않도록
  }

  function closeModal() {
    el('modal-overlay').classList.remove('show');
    el('modal').classList.remove('picking');
  }

  function selectedCondition() {
    const active = document.querySelector('#condition-chips .chip.active');
    return active ? active.dataset.val : 'free';
  }

  // 위치는 지도 핀이나 주소 둘 중 하나만 있으면 된다.
  // (주소만 온 경우 서버가 지오코딩해서 좌표를 채운다 — 좁은 지도에서 정확히
  //  못 찍는 사람이 제보 자체를 못 하는 상황을 막기 위함)
  function checkSubmitEnabled() {
    const hasName = !!el('f-name').value.trim();
    const hasPlace = !!el('f-address').value.trim();
    el('btn-submit').disabled = !(hasName && hasPlace);
  }

  async function submitReport() {
    const name = el('f-name').value.trim();
    const address = el('f-address').value.trim();
    if (!name || !address) return;
    // 이동장·가방 없이 동반 가능 + 견종·체중 제한 없음은 모달 상단 안내문으로
    // 사전 고지하고, 실제로 만족하는지는 검토 단계에서 확인합니다(입력창 없이 항상 true로 전송).
    const payload = {
      name,
      address,
      lat: '',
      lng: '',
      condition: selectedCondition(),
      noCarrier: true,
      noRestriction: true,
      note: el('f-note').value.trim(),
      contact: el('f-contact').value.trim(),
    };
    el('btn-submit').disabled = true;
    el('btn-submit').textContent = '제출 중...';
    try {
      const res = await fetch(SHEET_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
      // 서버가 중복·정책 위반으로 반려할 수 있으므로 응답을 확인한다.
      // (응답을 못 읽는 경우엔 접수된 것으로 보고 넘어간다)
      let result = null;
      try { result = await res.json(); } catch (_) { result = null; }

      if (result && result.ok === false) {
        if (result.duplicate) {
          closeModal();
          showToast(result.error || '이미 등록된 곳이에요.');
        } else {
          showToast(result.error || '제보를 접수하지 못했어요.');
          el('btn-submit').disabled = false;
          el('btn-submit').textContent = '제보하기';
        }
        return;
      }
      closeModal();
      showToast('제보 감사합니다! 검토 후 지도에 반영될게요 🐾');
    } catch (e) {
      showToast('제보 접수에 실패했어요. 다시 시도해 주세요.');
    }
    el('btn-submit').disabled = false;
    el('btn-submit').textContent = '제보하기';
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadFavorites();
    initMap();
    loadPlaces();

    el('fab-add').addEventListener('click', openModal);
    el('btn-cancel').addEventListener('click', closeModal);
    el('btn-submit').addEventListener('click', submitReport);
    el('f-name').addEventListener('input', checkSubmitEnabled);
    el('f-address').addEventListener('input', checkSubmitEnabled);

    document.querySelectorAll('#condition-chips .chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#condition-chips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
      });
    });

    document.querySelectorAll('#filter-row .fchip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#filter-row .fchip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.val;
        renderMarkers();
        renderList();
      });
    });

    el('list-toggle-btn').addEventListener('click', () => {
      el('sheet-overlay').classList.add('show');
    });
    el('sheet-close').addEventListener('click', () => {
      el('sheet-overlay').classList.remove('show');
    });
    el('sort-toggle').addEventListener('click', () => {
      sortByOldestChecked = !sortByOldestChecked;
      el('sort-toggle').textContent = sortByOldestChecked ? '기본순' : '최근확인일 오래된순';
      renderList();
    });
    el('sheet-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'sheet-overlay') el('sheet-overlay').classList.remove('show');
    });

    // 검색 — 입력할 때마다 지도·목록을 함께 갱신한다
    const searchInput = el('search-input');
    const applySearch = () => {
      searchQuery = searchInput.value;
      el('search-clear').hidden = !searchQuery;
      renderMarkers();
      renderList();
    };
    searchInput.addEventListener('input', applySearch);
    el('search-clear').addEventListener('click', () => {
      searchInput.value = '';
      applySearch();
      searchInput.focus();
    });

    el('region-btn').addEventListener('click', openRegionSheet);
    el('region-close').addEventListener('click', closeRegionSheet);
    el('region-apply').addEventListener('click', closeRegionSheet);
    el('region-reset').addEventListener('click', () => {
      selectedSido = null;
      selectedGus.clear();
      updateSidoChipState();
      renderGuRow();
      applyRegionChange();
    });
    el('region-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'region-overlay') closeRegionSheet();
    });

    el('locate-btn').addEventListener('click', () => {
      if (!navigator.geolocation) { showToast('위치 정보를 사용할 수 없어요.'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.setCenter(new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
          map.setZoom(15);
        },
        () => showToast('위치 권한이 필요해요.')
      );
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.setCenter(new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
          map.setZoom(13);
        },
        () => {}
      );
    }
  });
})();
</script>
</body>
</html>
